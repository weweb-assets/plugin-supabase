name: Tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Unit tests use Vue directly; the legacy CLI node-sass install is not needed.
      - run: npm ci --ignore-scripts
      - run: npm test
